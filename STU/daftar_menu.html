<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Menu Resto</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 40px;
            font-family: 'Kalam', cursive;
        }

        /* Kontainer agar kartu berjejer rapi */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background-color: white;
            border: 3px solid #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
            position: relative;
        }

        .image-container { position: relative; width: 100%; }
        
        .food-image { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; /* Agar gambar tidak gepeng */
            border: 1px solid #ddd; 
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #90ee90;
            border: 2px solid #2e7d32;
            padding: 5px 10px;
            font-weight: bold;
            color: #2e7d32;
            font-size: 14px;
        }

        .title { font-size: 28px; margin: 15px 0 5px 0; color: #1a1a1a; }
        .price { font-size: 22px; color: #f39c12; margin-bottom: 15px; }

        .btn-pesan {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #ffeaa7;
            border: 3px solid #f39c12;
            border-radius: 15px;
            font-family: 'Kalam', cursive;
            font-size: 18px;
            color: #d35400;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 40px;">Menu Spesial Hari Ini</h1>

    <div class="menu-container">
        
        <div class="card">
            <div class="image-container">
                <img src="nasi_goreng.jpg" alt="Nasi Goreng" class="food-image">
                <div class="badge">Free<br>Ongkir</div>
            </div>
            <h2 class="title">Nasi Goreng Ayam</h2>
            <div class="price">Rp. 15.000</div>
            <button class="btn-pesan">Pesan</button>
        </div>

        <div class="card">
            <div class="image-container">
                <img src="ayam_goreng.jpg" alt="Ayam Goreng" class="food-image">
                <div class="badge">Free<br>Ongkir</div>
            </div>
            <h2 class="title">Ayam Goreng Serundeng</h2>
            <div class="price">Rp. 20.000</div>
            <button class="btn-pesan">Pesan</button>
        </div>

        <div class="card">
            <div class="image-container">
                <img src="orange_juice.jpg" alt="Orange Juice" class="food-image">
                <div class="badge">Free<br>Ongkir</div>            </div>
            <h2 class="title">Orange Juice</h2>
            <div class="price">Rp. 10.000</div>
            <button class="btn-pesan">Pesan</button>
        </div>

    </div>

</body>
</html>
