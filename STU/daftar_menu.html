<!DOCTYPE html><!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Nasi Goreng</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: 'Kalam', cursive; 
        }

        .card {
            width: 350px;
            background-color: white;
            border: 3px solid #1a1a1a; 
            padding: 15px;
            border-radius: 5px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
            position: relative;
        }

        /
        .image-container {
            position: relative;
            width: 100%;
        }

        .food-image {
            width: 100%;
            display: block;
            border: 1px solid #ddd;
        }

     
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #90ee90; 
            border: 2px solid #2e7d32;
            padding: 5px 10px;
            font-weight: bold;
            color: #2e7d32;
            line-height: 1.2;
            text-align: center;
        }

      
        .content {
            margin-top: 20px;
        }

        .title {
            font-size: 32px;
            margin: 0;
            color: #1a1a1a;
        }

        .price {
            font-size: 24px;
            color: #f39c12; 
            margin: 10px 0;
        }

        .btn-pesan {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #ffeaa7; 
            border: 3px solid #f39c12;
            border-radius: 15px;
            font-family: 'Kalam', cursive;
            font-size: 20px;
            color: #d35400;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-pesan:hover {
            background-color: #f39c12;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="image-container">
            <img src="nasi_goreng.jpg" alt="Nasi Goreng Ayam" class="food-image">
            <div class="badge">Free<br>Ongkir</div>
        </div>

        <div class="content">
            <h2 class="title">Nasi Goreng Ayam</h2>
            <div class="price">Rp. 15.000</div>
            <button class="btn-pesan">Pesan</button>
        </div>
    </div>

</body>
</html>
